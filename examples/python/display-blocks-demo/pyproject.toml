[project]
name = "display-blocks-demo"
version = "0.1.0"
description = "Example Executa plugin — verbatim `_display` blocks (host-rendered error-journal headline & follow-up)"
requires-python = ">=3.10"
authors = [{ name = "Anna Developer" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.19.0"]

[project.scripts]
display-blocks-demo = "display_blocks_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["display_blocks_demo.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
