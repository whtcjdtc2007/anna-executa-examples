[project]
name = "tool-test-background-check-12345678"
version = "0.1.0"
description = "Demo Executa: a backend-owned health check that issues every reverse RPC outside any invoke."
requires-python = ">=3.10"
authors = [{ name = "Anna Developer" }]
license = { text = "MIT" }
dependencies = [
    "executa-sdk>=0.4.0",
]

[project.scripts]
# The script name MUST equal `project.name` (= the minted tool_id),
# because `anna-app dev` spawns the executa with `uvx <project.name>`.
"tool-test-background-check-12345678" = "background_check_plugin:main"

# When installing from this repo (e.g. `uv tool install .`), resolve
# `executa-sdk` from the local path instead of PyPI.
[tool.uv.sources]
executa-sdk = { path = "../../../../sdk/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["background_check_plugin.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
