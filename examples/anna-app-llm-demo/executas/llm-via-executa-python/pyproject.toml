[project]
name = "tool-test-llm-via-executa-12345678"
version = "0.1.0"
description = "Demo Executa: performs an LLM completion on behalf of the calling app via sampling/createMessage."
requires-python = ">=3.10"
authors = [{ name = "Anna Developer" }]
license = { text = "MIT" }
dependencies = [
    # AgentSessionClient.attach / live frames arrive in 0.4.0.
    "executa-sdk>=0.4.0",
]

[project.scripts]
# The script name MUST equal `project.name` (= the minted tool_id),
# because `anna-app dev` spawns the executa with `uvx <project.name>`.
"tool-test-llm-via-executa-12345678" = "llm_via_executa_plugin:main"

# When installing from this repo (e.g. `uv tool install .`), resolve
# `executa-sdk` from the local path instead of PyPI.
[tool.uv.sources]
executa-sdk = { path = "../../../../sdk/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["llm_via_executa_plugin.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
